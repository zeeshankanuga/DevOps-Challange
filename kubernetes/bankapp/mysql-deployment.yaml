apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: bankapp-ns
  labels:
    app: mysql
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql-container
        image: mysql:latest
        env:
        - name: MYSQL_ROOT_PASSWORD
          valuefrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password


        - name: MYSQL_DATABASE
          valuefrom:
            configMapKeyRef:
              name: mysql-configmap
              key: mysql-database

        resources:
         limits:
         memory: "128Mi"
         cpu: "500m"
        ports:
        - containerPort: 3306 

        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql

      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc